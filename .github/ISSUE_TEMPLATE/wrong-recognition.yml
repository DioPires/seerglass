name: Wrong recognition
description: A card was named wrong, a name was shown where there is no card, or a clear card was not named.
title: "Wrong recognition: "
labels: ["wrong-recognition"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports like this are how wrong cards get fixed.

        **Do not attach a frame or a screenshot.** The video's id and the time are enough to find the frame.

        This form is for Riftbound. For another game, use Discussions.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - YouTube
        - Twitch
    validations:
      required: true
  - type: input
    id: video-id
    attributes:
      label: Video id
      description: The id only, not a link. On YouTube it is the 11 characters after `v=`. On Twitch it is the number after `/videos/`.
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time in the video
      description: Hours, minutes and seconds, as exactly as you can.
      placeholder: "1:02:37"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where on the frame
      description: In words.
      placeholder: "Bottom row, third card from the left"
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What happened
      options:
        - A card was named as a different card
        - A name was shown on something that is not a card
        - A name was shown on a card back
        - A clear, readable card was not named
    validations:
      required: true
  - type: input
    id: shown
    attributes:
      label: What was shown
      description: The card name that was shown, or "nothing".
    validations:
      required: true
  - type: input
    id: truth
    attributes:
      label: What the card is
      description: The card's name, and its id if you know it. Leave empty if there is no card there.
  - type: dropdown
    id: source
    attributes:
      label: Kind of footage
      options:
        - Rift Atlas
        - TCG Arena
        - Physical play, camera near overhead
        - Physical play, camera at a steeper angle
        - Other
    validations:
      required: true
  - type: dropdown
    id: where-seen
    attributes:
      label: Where you saw it
      options:
        - The RiftSight browser extension
        - cardvision infer, with the released weights
        - cardvision infer, with other weights
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The extension's version, or the release id and the output of `cardvision --version`.
  - type: checkboxes
    id: no-images
    attributes:
      label: No images
      options:
        - label: This issue contains no frame and no screenshot.
          required: true
